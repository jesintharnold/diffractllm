server:
  port: 8085
  max_body_size: 32768   # KB -> 32MB; smaller values break base64 images in messages
  config_source: "sqlite"  # It is either yaml  or sqlite
  db_path: "./data/diffractllm.db"
  mock_enabled: true
  aes_pass_key: "12345678901234567890123456789012"
  trusted_proxies: []

upstream:
  max_idle_conns: 1000
  max_conns_per_host: 5000       # >= max_concurrency; on Linux set ulimit -n >= 65535 for busy HTTP/1.1 upstreams
  max_idle_conns_per_host: 256
  idle_conn_timeout: 90s
  dial_timeout: 5s
  keep_alive: 30s
  tls_handshake_timeout: 10s
  response_header_timeout: 30s  
  request_timeout: 60s          
  stream_idle_timeout: 60s   
  max_retries: 0            
  retry_backoff: 250ms     
  max_response_bytes: 32768 
  write_buffer_size: 65536   
  read_buffer_size: 16384  
  disable_compression: true
  max_concurrency: 5000

observability:
  log_level: "info"      # debug | info | warn | error
  log_format: "console"  # console for people, json for log shippers

modelcatalog:
  source_url: "https://getbifrost.ai/datasheet"
  sync_interval: 5m

governance:
  vkey_sync_interval: 10s     
  budget_sync_interval: 10s   
  budget_flush_interval: 10s   
  usage_flush_interval: 10s    
  usage_buffer_size: 100000

metrics_engine:
  enabled: true
  dsn: "./data/diffractllm-metrics.duckdb"
  buffer_capacity: 5000
  flush_interval: 5s
  prune_interval: 24h
  events_days: 90
  payloads_days: 7
  query_timeout: 5s
  max_page: 200
  max_window: 2160h
  payload_mode: errors_only   # none | errors_only | full
  payload_max_kb: 16
