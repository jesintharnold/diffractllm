server:
  port: 8085
  max_body_size: 32768   # KB -> 32MB; smaller values break base64 images in messages
  config_source: "sqlite"  # It is either yaml  or sqlite
  db_path: "./data/diffractllm.db"
  mock_enabled: true
  aes_pass_key: "12345678901234567890123456789012"

# Defaults for outbound calls to providers. This section is the FLOOR - a
# provider's own core.NetworkConfig is the only thing that overrides it, and
# only for the few settings it declares. Nothing sits underneath, so a value
# removed here is a zero handed to net/http, not a fallback.
#
# Durations take a unit ("5s", "2m"); a bare number means seconds.
upstream:
  max_idle_conns: 1000
  max_conns_per_host: 256
  max_idle_conns_per_host: 256
  idle_conn_timeout: 90s
  dial_timeout: 5s
  keep_alive: 30s
  tls_handshake_timeout: 10s
  response_header_timeout: 30s   # to first response header, safe for streams
  request_timeout: 60s           # whole non-streaming call; not applied to streams
  stream_idle_timeout: 60s       # max gap BETWEEN chunks, not total stream length
  max_response_bytes: 32768      # KB -> 32MB, mirrors server.max_body_size
  write_buffer_size: 65536
  read_buffer_size: 65536
  disable_compression: true

observability:
  log_level: "debug"

modelcatalog:
  source_url: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
  sync_interval: 5m
